# Weekly draft content pack — human reviews / approves / exports locally.
# Does NOT publish to WordPress or Google Business Profile.
name: Weekly micro SEO

on:
  schedule:
    # Monday 14:20 UTC
    - cron: "20 14 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ensure config.yaml
        run: |
          if [ ! -f config.yaml ]; then
            cp config.example.yaml config.yaml
          fi

      - name: Run SEO pack pipeline (draft only)
        # Template-only — no OPENAI_API_KEY required for a usable pack.
        run: python -m src --template-only

      - name: Upload out/ as draft artifact
        uses: actions/upload-artifact@v4
        with:
          name: micro-seo-draft
          path: out/
          if-no-files-found: error
          retention-days: 14
